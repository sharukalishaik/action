name: Docs-as-Ops Gating Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Silences infrastructure warnings by forcing execution on the Node 24 runtime
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: write
jobs:
  validate-and-compile:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Application Dependency Matrix
        run: npm ci

      - name: Execute Strict Production Build Compilation
        run: npm run build

      - name: Deploy Compiled Assets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build