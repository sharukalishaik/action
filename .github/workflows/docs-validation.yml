name: Docs-as-Ops Gating Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Silences infrastructure warnings by forcing execution on the Node 24 runtime
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-compile:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Application Dependency Matrix
        run: npm ci

      - name: Execute Strict Production Build Compilation
        run: npm run build

      - name: Deploy to Live Local Web Server
        run: |
          # Use npx docusaurus serve to host the production directory on port 3001 in the background
          # We check if a background instance is already running and refresh it safely
          pkill -f "docusaurus serve" || true
          nohup npx docusaurus serve --port 3001 --host 0.0.0.0 > /dev/null 2>&1 &