# # This is a basic workflow to help you get started with Actions

# name: GitHub Actions Demo

# # Controls when the workflow will run
# on:
#   # Triggers the workflow on push or pull request events but only for the "main" branch
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]

#   # Allows you to run this workflow manually from the Actions tab
#   workflow_dispatch:

# # A workflow run is made up of one or more jobs that can run sequentially or in parallel
# jobs:
#   # This workflow contains a single job called "build"
#   build:
#     # The type of runner that the job will run on
#     runs-on: ubuntu-latest

#     # Steps represent a sequence of tasks that will be executed as part of the job
#     steps:
#       # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
#       - uses: actions/checkout@v4

#       # Runs a single command using the runners shell
#       - name: Run a one-line script
#         run: echo Hello, world!

#       # Runs a set of commands using the runners shell
#       - name: Run a multi-line script
#         run: |
#           echo Add other actions to build,
#           echo test, and deploy your project.

# The name of the workflow as it appears in your GitHub Actions tab
name: GitHub Actions Demo

# Controls when the workflow will run (The Trigger Event)
on:
  push:
    branches: [ main ]

# The jobs to execute when the event happens
jobs:
  explore-github-actions:
    # Specifies the type of isolated virtual machine runner to provision
    runs-on: ubuntu-latest

    # Global environment settings for this specific job
    env:
      # Explicitly forces third-party actions to use the stable Node 24 runtime wrapper
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    # The sequential steps executed inside the runner environment
    steps:
      - name: Print a welcome message
        run: echo "Hello, World! GitHub Actions is running."

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: List files in the repository
        run: |
          echo "The repository contains the following files:"
          ls -la
