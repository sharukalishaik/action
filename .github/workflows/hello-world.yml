name: Docs-as-Ops Gating Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-compile:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Application Dependency Matrix
        run: npm ci

      - name: Execute Strict Production Build Compilation
        run: npm run build